<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Алкоголик</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&display=swap" rel="stylesheet">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#0F1114">
</head>
<body>

    <!-- ЭКРАН 1: ГЛАВНАЯ -->
    <div id="screen-home" class="screen active">
        <div class="container">
            <div class="stat-tile money-block">
                <span class="stat-label">Потрачено</span>
                <div class="money-cols">
                    <div class="money-col">
                        <span class="stat-value" id="stat-money-month">0 ₽</span>
                        <span class="money-sub">за месяц</span>
                    </div>
                    <div class="money-col">
                        <span class="stat-value" id="stat-money-all">0 ₽</span>
                        <span class="money-sub">за всё время</span>
                    </div>
                </div>
            </div>

            <div class="stats-grid">
                <div class="stat-tile">
                    <span class="stat-label">🍺 Пиво</span>
                    <span class="stat-value" id="stat-beer">0 л</span>
                </div>
                <div class="stat-tile">
                    <span class="stat-label">🍷 Вино</span>
                    <span class="stat-value" id="stat-wine">0 л</span>
                </div>
                <div class="stat-tile">
                    <span class="stat-label">🥃 Крепкое</span>
                    <span class="stat-value" id="stat-strong">0 л</span>
                </div>
            </div>

            <div class="summary-tile" id="home-summary"></div>
        </div>
    </div>

    <!-- ЭКРАН 2: КАЛЕНДАРЬ -->
    <div id="screen-calendar" class="screen">
        <div class="container">
            <header class="cal-header">
                <button class="cal-nav" onclick="changeMonth(-1)">‹</button>
                <h1 id="cal-title">Сентябрь 2026</h1>
                <button class="cal-nav" onclick="changeMonth(1)">›</button>
            </header>

            <div class="cal-weekdays">
                <span>Пн</span><span>Вт</span><span>Ср</span><span>Чт</span><span>Пт</span><span>Сб</span><span>Вс</span>
            </div>
            <div id="cal-grid" class="cal-grid"></div>

            <div class="cal-legend">
                <span class="legend-item"><span class="legend-bar beer"></span>Пиво</span>
                <span class="legend-item"><span class="legend-bar wine"></span>Вино</span>
                <span class="legend-item"><span class="legend-bar strong"></span>Крепкое</span>
            </div>

            <div id="day-details" class="day-details"></div>
        </div>
    </div>

    <!-- ЭКРАН 3: АНАЛИТИКА -->
    <div id="screen-analytics" class="screen">
        <div class="container">
            <header class="cal-header">
                <button class="cal-nav" onclick="changeYear(-1)">‹</button>
                <h1 id="year-title">2026</h1>
                <button class="cal-nav" onclick="changeYear(1)">›</button>
            </header>
            <div id="months-list"></div>
        </div>
    </div>

    <!-- ЭКРАН 4: СОХРАНЕНИЕ -->
    <div id="screen-save" class="screen">
        <div class="container">
            <h1>Сохранение</h1>
            <p class="save-hint">Все записи хранятся только на этом телефоне. Раз в неделю скачивай копию в файл, чтобы не потерять данные.</p>
            <button class="tile-btn save-action" onclick="exportData()">Сохранить данные</button>
            <button class="tile-btn restore-action" onclick="document.getElementById('restore-file').click()">Восстановить из файла</button>
            <input type="file" id="restore-file" accept=".json,application/json" style="display:none">
            <div class="backup-info" id="backup-info"></div>
        </div>
    </div>

    <!-- НИЖНИЕ ВКЛАДКИ -->
    <nav class="bottom-nav">
        <button class="tab active" id="tab-home" onclick="switchTab('home')">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
            <span>Главная</span>
        </button>
        <button class="tab" id="tab-calendar" onclick="switchTab('calendar')">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
            <span>Календарь</span>
        </button>
        <button class="tab" id="tab-analytics" onclick="switchTab('analytics')">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
            <span>Аналитика</span>
        </button>
        <button class="tab" id="tab-save" onclick="switchTab('save')">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
            <span>Сохранение</span>
        </button>
    </nav>

    <!-- ШТОРКА ЗАПИСИ -->
    <div id="sheet-overlay" class="sheet-overlay">
        <div class="sheet">
            <div class="sheet-handle"></div>
            <h3 id="sheet-title">Запись</h3>

            <span class="group-label">Алкоголь</span>
            <div id="alc-rows"></div>
            <button class="add-row-btn" onclick="addRow('alc')">+ Добавить напиток</button>

            <span class="group-label">Миксеры</span>
            <div id="mix-rows"></div>
            <button class="add-row-btn" onclick="addRow('mix')">+ Добавить миксер</button>

            <div class="sheet-total">Итого: <span id="sheet-total">0 ₽</span></div>

            <button class="tile-btn save-btn wide-btn" onclick="saveSheet()">Сохранить запись</button>
        </div>
    </div>

    <!-- ПИКЕР -->
    <div id="picker-overlay" class="picker-overlay">
        <div class="picker" id="picker-list"></div>
    </div>

    <script src="app.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', function () {
                navigator.serviceWorker.register('sw.js');
            });
        }
    </script>
</body>
</html>
