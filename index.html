<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Мой Трекер</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#0E0F12">
</head>
<body>

    <!-- ЭКРАН 1: ГЛАВНАЯ -->
    <div id="screen-home" class="screen active">
        <div class="container">
            <header class="page-header">
                <h1 id="month-title">Сентябрь</h1>
            </header>

            <!-- Статистика: одна карточка на 4 сектора -->
            <div class="stats-card">
                <div class="stat">
                    <span class="stat-label">Потрачено</span>
                    <span class="stat-value" id="stat-money">0 ₽</span>
                </div>
                <div class="stat">
                    <span class="stat-label">Калории</span>
                    <span class="stat-value" id="stat-calories">0 ккал</span>
                </div>
                <div class="stat">
                    <span class="stat-label">🥃 Крепкое</span>
                    <span class="stat-value" id="stat-strong">0 л</span>
                </div>
                <div class="stat">
                    <span class="stat-label">🍺 Пиво</span>
                    <span class="stat-value" id="stat-beer">0 л</span>
                </div>
            </div>

            <!-- Кнопки добавления -->
            <section class="controls">
                <div class="control-group">
                    <span class="group-label">Алкоголь</span>
                    <div class="btn-row">
                        <button class="btn-add" onclick="openModal('beer')">Пиво</button>
                        <button class="btn-add" onclick="openModal('gin')">Джин</button>
                        <button class="btn-add" onclick="openModal('rum')">Ром</button>
                        <button class="btn-add" onclick="openModal('whiskey')">Виски</button>
                        <button class="btn-add" onclick="openModal('tincture')">Настойка</button>
                    </div>
                </div>

                <div class="control-group">
                    <span class="group-label">Миксеры</span>
                    <div class="btn-row">
                        <button class="btn-add" onclick="openModal('tonic')">Тоник</button>
                        <button class="btn-add" onclick="openModal('cola')">Кола</button>
                        <button class="btn-add" onclick="openModal('lemonade')">Лимонад</button>
                        <button class="btn-add" onclick="openModal('juice')">Сок</button>
                    </div>
                </div>

                <div class="control-group">
                    <span class="group-label">Еда</span>
                    <div class="btn-row">
                        <button class="btn-add" onclick="openModal('peanuts')">Арахис 200г</button>
                        <button class="btn-add" onclick="openModal('other_food')">Другая еда</button>
                    </div>
                </div>
            </section>
        </div>
    </div>

    <!-- ЭКРАН 2: ИСТОРИЯ -->
    <div id="screen-history" class="screen">
        <div class="container">
            <header class="page-header">
                <h1>История</h1>
                <button id="clear-history-btn" class="ghost-btn">Очистить всё</button>
            </header>
            <div id="history-empty" class="empty-state">Пока пусто.<br>Добавь первую запись на главном экране.</div>
            <ul id="history-list"></ul>
        </div>
    </div>

    <!-- НИЖНИЕ ВКЛАДКИ -->
    <nav class="bottom-nav">
        <button class="tab active" id="tab-home" onclick="switchTab('home')">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
            <span>Главная</span>
        </button>
        <button class="tab" id="tab-history" onclick="switchTab('history')">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
            <span>История</span>
        </button>
    </nav>

    <!-- ОКНО ВВОДА -->
    <div id="modal-overlay" class="modal-overlay">
        <div class="modal">
            <h3 id="modal-title">Добавить</h3>

            <div class="input-group">
                <label id="volume-label">Объем (мл)</label>
                <input type="number" id="input-volume" value="500" min="0" step="50" inputmode="numeric">
            </div>

            <div class="input-group">
                <label>Цена (₽)</label>
                <input type="number" id="input-price" value="0" min="0" inputmode="numeric">
            </div>

            <div class="modal-info">
                Калорийность: ~<span id="modal-calories">0</span> ккал
            </div>

            <div class="modal-buttons">
                <button class="btn-add" onclick="closeModal()">Отмена</button>
                <button class="btn-add save-btn" onclick="saveEntry()">Сохранить</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
