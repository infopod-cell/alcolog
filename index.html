<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Мой Трекер</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&display=swap" rel="stylesheet">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#0F1114">
</head>
<body>

    <!-- ЭКРАН 1: ГЛАВНАЯ (витрина) -->
    <div id="screen-home" class="screen active">
        <div class="container">
            <header class="page-header">
                <h1 id="month-title">Сентябрь</h1>
            </header>

            <div class="stats-grid">
                <div class="stat-tile">
                    <span class="stat-label">Потрачено</span>
                    <span class="stat-value" id="stat-money">0 ₽</span>
                </div>
                <div class="stat-tile">
                    <span class="stat-label">Калории</span>
                    <span class="stat-value" id="stat-calories">0 ккал</span>
                </div>
                <div class="stat-tile">
                    <span class="stat-label">🥃 Крепкое</span>
                    <span class="stat-value" id="stat-strong">0 л</span>
                </div>
                <div class="stat-tile">
                    <span class="stat-label">🍺 Пиво</span>
                    <span class="stat-value" id="stat-beer">0 л</span>
                </div>
            </div>

            <div class="summary-tile" id="home-summary"></div>
        </div>
    </div>

    <!-- ЭКРАН 2: КАЛЕНДАРЬ -->
    <div id="screen-calendar" class="screen">
        <div class="container">
            <header class="cal-header">
                <button class="cal-nav" onclick="changeMonth(-1)">‹</button>
                <h1 id="cal-title">Сентябрь 2026</h1>
                <button class="cal-nav" onclick="changeMonth(1)">›</button>
            </header>

            <div class="cal-weekdays">
                <span>Пн</span><span>Вт</span><span>Ср</span><span>Чт</span><span>Пт</span><span>Сб</span><span>Вс</span>
            </div>
            <div id="cal-grid" class="cal-grid"></div>

            <div class="cal-legend">
                <span class="legend-item"><span class="legend-bar beer"></span>Пиво</span>
                <span class="legend-item"><span class="legend-bar strong"></span>Крепкое</span>
                <span class="legend-item"><span class="legend-bar both"></span>И то и другое</span>
            </div>

            <div id="day-details" class="day-details"></div>
        </div>
    </div>

    <!-- ЭКРАН 3: ИСТОРИЯ -->
    <div id="screen-history" class="screen">
        <div class="container">
            <header class="page-header">
                <h1>История</h1>
                <button id="clear-history-btn" class="ghost-btn">Очистить всё</button>
            </header>
            <div id="history-empty" class="empty-state">Пока пусто.<br>Добавь первую запись в календаре.</div>
            <ul id="history-list"></ul>
        </div>
    </div>

    <!-- НИЖНИЕ ВКЛАДКИ -->
    <nav class="bottom-nav">
        <button class="tab active" id="tab-home" onclick="switchTab('home')">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
            <span>Главная</span>
        </button>
        <button class="tab" id="tab-calendar" onclick="switchTab('calendar')">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
            <span>Календарь</span>
        </button>
        <button class="tab" id="tab-history" onclick="switchTab('history')">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
            <span>История</span>
        </button>
    </nav>

    <!-- ШТОРКА ЗАПИСИ -->
    <div id="sheet-overlay" class="sheet-overlay">
        <div class="sheet">
            <div class="sheet-handle"></div>
            <h3 id="sheet-title">Запись</h3>

            <span class="group-label">Алкоголь</span>
            <div class="tile-grid cols-3">
                <button class="tile-btn sheet-product" data-key="beer" onclick="selectProduct('beer')">Пиво</button>
                <button class="tile-btn sheet-product" data-key="gin" onclick="selectProduct('gin')">Джин</button>
                <button class="tile-btn sheet-product" data-key="rum" onclick="selectProduct('rum')">Ром</button>
                <button class="tile-btn sheet-product" data-key="whiskey" onclick="selectProduct('whiskey')">Виски</button>
                <button class="tile-btn sheet-product" data-key="tincture" onclick="selectProduct('tincture')">Настойка</button>
            </div>

            <span class="group-label">Миксеры</span>
            <div class="tile-grid cols-4">
                <button class="tile-btn small sheet-product" data-key="tonic" onclick="selectProduct('tonic')">Тоник</button>
                <button class="tile-btn small sheet-product" data-key="cola" onclick="selectProduct('cola')">Кола</button>
                <button class="tile-btn small sheet-product" data-key="lemonade" onclick="selectProduct('lemonade')">Лимонад</button>
                <button class="tile-btn small sheet-product" data-key="juice" onclick="selectProduct('juice')">Сок</button>
            </div>

            <span class="group-label">Еда</span>
            <div class="tile-grid cols-2">
                <button class="tile-btn sheet-product" data-key="peanuts" onclick="selectProduct('peanuts')">Арахис 200г</button>
                <button class="tile-btn sheet-product" data-key="other_food" onclick="selectProduct('other_food')">Другая еда</button>
            </div>

            <div class="input-row">
                <div class="input-group">
                    <label id="sheet-volume-label">Объем (мл)</label>
                    <input type="number" id="input-volume" value="500" min="0" step="50" inputmode="numeric">
                </div>
                <div class="input-group">
                    <label>Цена (₽)</label>
                    <input type="number" id="input-price" value="0" min="0" inputmode="numeric">
                </div>
            </div>

            <div class="sheet-info">
                Калорийность: ~<span id="sheet-calories">0</span> ккал
            </div>

            <div class="sheet-buttons">
                <button class="tile-btn" onclick="closeSheet()">Отмена</button>
                <button class="tile-btn save-btn" onclick="saveEntry()">Сохранить</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
